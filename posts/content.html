<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Di Sản - Tử Vi Hoàng Hạc</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Arimo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-color: #5d1a1a; --accent-color: #c5a059; --bg-color: #fffaf1; --text-color: #2c3e50; }
        body { margin: 0; font-family: 'Arimo', sans-serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.8; }
        
        /* Menu tối giản */
        nav { background: var(--primary-color); padding: 1rem; text-align: center; border-bottom: 3px solid var(--accent-color); position: sticky; top: 0; z-index: 100; }
        nav a { color: white; text-decoration: none; font-weight: bold; margin: 0 15px; text-transform: uppercase; font-size: 0.9rem; }
        
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }

        /* Trang danh sách bài viết */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2.5rem; margin-top: 30px; }
        .card { 
            background: white; padding: 1.8rem; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); 
            border-top: 5px solid var(--primary-color); display: flex; flex-direction: column; transition: 0.3s;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .card h3 { margin: 10px 0; color: var(--primary-color); font-family: 'Playfair Display', serif; }
        .card p { font-size: 0.95rem; color: #555; margin-bottom: 1.5rem; }

        /* Trang chi tiết bài viết */
        .article-container { max-width: 850px; margin: 2rem auto; background: white; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); padding: 4rem; }
        .post-meta { color: var(--accent-color); font-weight: bold; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; margin-bottom: 15px; display: block; }
        h1 { font-family: 'Playfair Display', serif; color: var(--primary-color); font-size: 2.8rem; line-height: 1.2; margin: 0; }
        
        .content { margin-top: 2.5rem; font-size: 1.15rem; text-align: justify; color: var(--text-color); }
        .content h2 { color: var(--primary-color); font-family: 'Playfair Display', serif; border-left: 5px solid var(--accent-color); padding-left: 20px; margin-top: 3rem; font-size: 1.8rem; }
        .content p { margin-bottom: 1.5rem; }
        
        /* Khung trích dẫn tự động */
        .quote-box { background: #fdf2f2; border-right: 5px solid var(--primary-color); padding: 25px; font-style: italic; margin: 2.5rem 0; color: var(--primary-color); line-height: 1.6; position: relative; }

        /* Nút bấm */
        .btn { padding: 10px 20px; text-decoration: none; font-weight: bold; text-align: center; border-radius: 5px; cursor: pointer; transition: 0.3s; display: inline-block; }
        .btn-view { border: 2px solid var(--primary-color); color: var(--primary-color); background: none; margin-top: auto; }
        .btn-view:hover { background: var(--primary-color); color: white; }
        .btn-back { background: none; border: 2px solid var(--primary-color); color: var(--primary-color); margin-top: 3rem; }
        .btn-back:hover { background: var(--primary-color); color: white; }

        .hidden { display: none; }
        @media (max-width: 768px) { .article-container { padding: 2rem; margin: 1rem; } h1 { font-size: 2rem; } }
    </style>
</head>
<body>

<nav>
    <a href="../index.html">🏠 TRANG CHỦ CHÍNH</a>
</nav>

<div class="container">
    <div id="list-view">
        <h2 style="font-family: 'Playfair Display', serif; color: var(--primary-color); text-align: center; font-size: 2.2rem; margin-top: 40px;">Hệ Thống Nghiệm Lý Chi Tiết</h2>
        <p style="text-align: center; color: var(--accent-color); font-weight: bold;">DI SẢN CỤ HOÀNG HẠC (TRƯƠNG CUNG TÙNG)</p>
        <div class="grid" id="post-grid">Đang kết nối thư viện di sản...</div>
    </div>

    <div id="detail-view" class="hidden">
        <article class="article-container">
            <span id="article-meta" class="post-meta"></span>
            <h1 id="article-title"></h1>
            <div id="article-content" class="content"></div>
            <center><button class="btn btn-back" onclick="toggleView(false)">← Quay lại danh sách</button></center>
        </article>
    </div>
</div>

<script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSLZA2IK9KlB335IHmfHYMDrW3TYRsV68Cu9E5rpKqar6n0dxYXUFl-WydtW4glFTg-f-OQGesLC_Me/pub?gid=0&single=true&output=csv';
    
    let db = [];

    async function init() {
        try {
            const res = await fetch(SHEET_URL);
            const csv = await res.text();
            
            // Chia dòng thông minh: Chỉ chia dòng khi gặp dấu xuống dòng nằm ngoài dấu ngoặc kép
            const rows = csv.split(/\r?\n(?=(?:(?:[^"]*"){2})*[^"]*$)/).slice(1);
            
            db = rows.map(r => {
                // Tách cột chuẩn xác hỗ trợ nội dung dài chứa dấu phẩy
                const c = r.match(/(".*?"|[^",\n\r]+)(?=\s*,|\s*(\n|\r|$))/g) || [];
                
                const clean = (val) => val ? val.replace(/^"|"$/g, '').replace(/""/g, '"').trim() : "";

                return {
                    id: clean(c[0]),      // Cột A
                    cat: clean(c[1]),     // Cột B
                    title: clean(c[2]),   // Cột C
                    desc: clean(c[3]),    // Cột D
                    content: clean(c[7])  // Cột H (Đúng vị trí chứa bài luận)
                };
            }).filter(p => p.id);
            
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');
            
            if(postId) {
                renderList(); 
                showPost(postId);
            } else {
                renderList();
            }
        } catch (e) { 
            console.error(e);
            document.getElementById('post-grid').innerHTML = "Lỗi kết nối dữ liệu di sản.";
        }
    }

    function renderList() {
        const grid = document.getElementById('post-grid');
        grid.innerHTML = db.map(p => `
            <div class="card">
                <span class="post-meta" style="font-size: 0.7rem;">${p.cat}</span>
                <h3>${p.title}</h3>
                <p>${p.desc}</p>
                <button class="btn btn-view" onclick="showPost('${p.id}')">Xem nội dung →</button>
            </div>
        `).join('');
    }

    function showPost(id) {
        const p = db.find(x => x.id === id);
        if(!p) return;

        document.getElementById('article-meta').innerText = p.cat;
        document.getElementById('article-title').innerText = p.title;
        
        // XỬ LÝ NỘI DUNG CHI TIẾT
        const rawText = p.content || "Nội dung đang được cập nhật...";
        // Tách các dòng thực tế trong bài luận
        const lines = rawText.split(/\r?\n/);
        let formattedHtml = "";

        lines.forEach(line => {
            const text = line.trim();
            if(!text) return;

            // 1. Dòng bắt đầu bằng số (Ví dụ: 1. Ý nghĩa...) -> Biến thành H2
            if(/^\d+\./.test(text)) {
                formattedHtml += `<h2>${text}</h2>`;
            } 
            // 2. Dòng trích dẫn đặc biệt (Nếu bạn muốn bọc khung cho các câu phú)
            else if(text.length < 100 && (text.includes(":") || text.startsWith("-"))) {
                formattedHtml += `<div class="quote-box">${text}</div>`;
            }
            // 3. Đoạn văn bình thường
            else {
                formattedHtml += `<p>${text}</p>`;
            }
        });

        document.getElementById('article-content').innerHTML = formattedHtml;
        toggleView(true);
        window.scrollTo(0,0);
        document.title = p.title + " - Tử Vi Hoàng Hạc";
    }

    function toggleView(isDetail) {
        if(isDetail) {
            document.getElementById('list-view').classList.add('hidden');
            document.getElementById('detail-view').classList.remove('hidden');
        } else {
            document.getElementById('list-view').classList.remove('hidden');
            document.getElementById('detail-view').classList.add('hidden');
            document.title = "Hệ Thống Di Sản - Tử Vi Hoàng Hạc";
        }
    }

    window.onload = init;
</script>
</body>
</html>
