<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nội Dung Di Sản - Tử Vi Hoàng Hạc</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Arimo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-color: #5d1a1a; --accent-color: #c5a059; --bg-color: #fffaf1; --text-color: #2c3e50; }
        body { margin: 0; font-family: 'Arimo', sans-serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.8; }
        header { background-color: var(--primary-color); color: var(--accent-color); padding: 1.5rem; text-align: center; border-bottom: 5px solid var(--accent-color); }
        header h1 { font-family: 'Playfair Display', serif; margin: 0; font-size: 1.8rem; }
        .container { max-width: 850px; margin: 3rem auto; padding: 0 1.5rem; }
        .article-container { background: white; padding: 4rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .post-meta { color: var(--accent-color); font-weight: bold; text-transform: uppercase; font-size: 0.85rem; margin-bottom: 10px; display: block; }
        h1 { font-family: 'Playfair Display', serif; color: var(--primary-color); font-size: 2.5rem; line-height: 1.2; margin: 0 0 2rem 0; }
        .content { font-size: 1.15rem; text-align: justify; }
        .content h2 { color: var(--primary-color); border-left: 5px solid var(--accent-color); padding-left: 15px; margin-top: 2rem; font-family: 'Playfair Display', serif; }
        .content p { margin-bottom: 1.5rem; }
        .btn-back { display: inline-block; margin-bottom: 2rem; text-decoration: none; color: var(--primary-color); font-weight: bold; }
        footer { text-align: center; padding: 3rem; background: #1a1a1a; color: white; margin-top: 5rem; }
        .loading { text-align: center; font-style: italic; color: gray; }
    </style>
</head>
<body>

<header><h1>TỬ VI HOÀNG HẠC</h1></header>

<div class="container">
    <a href="index.html" class="btn-back">← Quay lại danh sách</a>
    <article class="article-container" id="article-view">
        <div class="loading">Đang tải nội dung từ di sản...</div>
    </article>
</div>

<footer><p>&copy; 2026 Tử Vi Hoàng Hạc</p></footer>

<script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSLZA2IK9KlB335IHmfHYMDrW3TYRsV68Cu9E5rpKqar6n0dxYXUFl-WydtW4glFTg-f-OQGesLC_Me/pub?gid=0&single=true&output=csv&cache=' + new Date().getTime();

    function parseCSVLine(text) {
        const r = []; let c = '', q = false;
        for (let i = 0; i < text.length; i++) {
            let char = text[i];
            if (char === '"') { if (q && text[i+1] === '"') { c += '"'; i++; } else q = !q; }
            else if (char === ',' && !q) { r.push(c.trim()); c = ''; }
            else c += char;
        }
        r.push(c.trim()); return r;
    }

    async function loadPost() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if(!id) { window.location.href = 'index.html'; return; }

        try {
            const res = await fetch(SHEET_URL);
            const csv = await res.text();
            const rows = csv.split(/\r?\n(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            const headers = parseCSVLine(rows[0]).map(h => h.toLowerCase().trim());
            
            const idx = { 
                id: headers.indexOf('id'), 
                cat: headers.indexOf('category'), 
                title: headers.indexOf('title'), 
                content: headers.indexOf('fullcontent') 
            };

            const postRow = rows.slice(1).find(r => parseCSVLine(r)[idx.id] === id);
            
            if(postRow) {
                const c = parseCSVLine(postRow);
                const title = c[idx.title];
                const category = c[idx.cat];
                const contentRaw = c[idx.content] || "Nội dung đang được cập nhật...";
                
                // Xử lý nội dung: Xuống dòng thành paragraph
                const contentHtml = contentRaw.split(/\r?\n/).map(line => {
                    const t = line.trim();
                    if(!t) return '';
                    if(/^\d+\./.test(t) || t.endsWith(':')) return `<h2>${t}</h2>`;
                    return `<p>${t}</p>`;
                }).join('');

                document.getElementById('article-view').innerHTML = `
                    <span class="post-meta">${category}</span>
                    <h1>${title}</h1>
                    <div class="content">${contentHtml}</div>
                    <center><a href="index.html" style="margin-top:3rem" class="btn-back">Quay về trang chủ</a></center>
                `;
                document.title = title + " - Tử Vi Hoàng Hạc";
            } else {
                document.getElementById('article-view').innerHTML = "Không tìm thấy bài viết.";
            }
        } catch (e) {
            document.getElementById('article-view').innerHTML = "Lỗi kết nối dữ liệu.";
        }
    }
    window.onload = loadPost;
</script>
</body>
</html>
