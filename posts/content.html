<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Di Sản - Tử Vi Hoàng Hạc</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Arimo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-color: #5d1a1a; --accent-color: #c5a059; --bg-color: #fffaf1; --text-color: #2c3e50; }
        body { margin: 0; font-family: 'Arimo', sans-serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.8; }
        
        nav { background: var(--primary-color); padding: 1rem; text-align: center; border-bottom: 3px solid var(--accent-color); position: sticky; top: 0; z-index: 100; }
        nav a { color: white; text-decoration: none; font-weight: bold; margin: 0 15px; text-transform: uppercase; font-size: 0.9rem; }
        
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }

        /* Grid bài viết */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2.5rem; margin-top: 30px; }
        .card { 
            background: white; padding: 1.8rem; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); 
            border-top: 5px solid var(--primary-color); display: flex; flex-direction: column; transition: 0.3s;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .card h3 { margin: 10px 0; color: var(--primary-color); font-family: 'Playfair Display', serif; }

        /* Chi tiết bài viết */
        .article-container { max-width: 850px; margin: 2rem auto; background: white; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); padding: 4rem; }
        .post-meta { color: var(--accent-color); font-weight: bold; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; margin-bottom: 15px; display: block; }
        h1 { font-family: 'Playfair Display', serif; color: var(--primary-color); font-size: 2.5rem; line-height: 1.2; margin-bottom: 2rem; }
        
        .content { margin-top: 2rem; font-size: 1.15rem; text-align: justify; }
        
        /* Định dạng Header nội bộ (Cột H) */
        .inner-header { color: var(--primary-color); font-family: 'Playfair Display', serif; border-bottom: 2px solid var(--accent-color); padding-bottom: 15px; margin-bottom: 25px; font-size: 1.8rem; }
        
        /* Định dạng các đoạn thân bài (Cột I) */
        .content p { margin-bottom: 1.5rem; text-indent: 20px; }
        .content h2 { color: var(--primary-color); font-family: 'Playfair Display', serif; margin-top: 2.5rem; font-size: 1.5rem; border-left: 4px solid var(--accent-color); padding-left: 15px; }

        /* Định dạng Kết luận (Cột J) */
        .quote-box { background: #fdf2f2; border-right: 5px solid var(--primary-color); padding: 30px; font-style: italic; margin-top: 4rem; color: var(--primary-color); position: relative; border-radius: 4px; }
        .quote-box::before { content: "Lời kết:"; font-weight: bold; font-style: normal; display: block; margin-bottom: 10px; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }

        .btn { padding: 12px 25px; text-decoration: none; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.3s; display: inline-block; border: 2px solid var(--primary-color); }
        .btn-view { color: var(--primary-color); background: none; margin-top: auto; }
        .btn-view:hover { background: var(--primary-color); color: white; }
        .btn-back { color: var(--primary-color); background: none; margin-top: 3rem; }
        .btn-back:hover { background: var(--primary-color); color: white; }

        .hidden { display: none; }
        @media (max-width: 768px) { .article-container { padding: 2rem; margin: 1rem; } h1 { font-size: 1.8rem; } }
    </style>
</head>
<body>

<nav>
    <a href="../index.html">🏠 TRANG CHỦ CHÍNH</a>
</nav>

<div class="container">
    <!-- DANH SÁCH BÀI VIẾT -->
    <div id="list-view">
        <h2 style="font-family: 'Playfair Display', serif; color: var(--primary-color); text-align: center; font-size: 2.2rem; margin-top: 40px;">Hệ Thống Nghiệm Lý Chi Tiết</h2>
        <p style="text-align: center; color: var(--accent-color); font-weight: bold;">DI SẢN CỤ HOÀNG HẠC (TRƯƠNG CUNG TÙNG)</p>
        <div class="grid" id="post-grid">Đang tải dữ liệu di sản...</div>
    </div>

    <!-- CHI TIẾT BÀI VIẾT -->
    <div id="detail-view" class="hidden">
        <article class="article-container">
            <span id="article-meta" class="post-meta"></span>
            <h1 id="article-title"></h1>
            <div id="article-content" class="content"></div>
            <center><button class="btn btn-back" onclick="toggleView(false)">← Quay lại danh sách</button></center>
        </article>
    </div>
</div>

<script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSLZA2IK9KlB335IHmfHYMDrW3TYRsV68Cu9E5rpKqar6n0dxYXUFl-WydtW4glFTg-f-OQGesLC_Me/pub?gid=0&single=true&output=csv';
    
    let db = [];

    // Hàm bóc tách CSV chuyên dụng
    function parseCSVLine(text) {
        const result = [];
        let cur = '';
        let inQuote = false;
        for (let i = 0; i < text.length; i++) {
            let char = text[i];
            if (char === '"') {
                if (inQuote && text[i + 1] === '"') { cur += '"'; i++; }
                else { inQuote = !inQuote; }
            } else if (char === ',' && !inQuote) {
                result.push(cur.trim()); cur = '';
            } else { cur += char; }
        }
        result.push(cur.trim());
        return result;
    }

    async function init() {
        try {
            const res = await fetch(SHEET_URL);
            const csv = await res.text();
            const rows = csv.split(/\r?\n(?=(?:(?:[^"]*"){2})*[^"]*$)/).slice(1);
            
            db = rows.map(r => {
                const c = parseCSVLine(r);
                return {
                    id: c[0] || "",
                    cat: c[1] || "",
                    title: c[2] || "",
                    desc: c[3] || "",
                    h_header: c[7] || "", // Cột H
                    i_body:   c[8] || "", // Cột I
                    j_footer: c[9] || ""  // Cột J
                };
            }).filter(p => p.id);
            
            // Xử lý Deep Link (nếu vào bằng link ?id=...)
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');
            if(postId) { renderList(); showPost(postId); } 
            else { renderList(); }
        } catch (e) { 
            document.getElementById('post-grid').innerHTML = "Không thể kết nối dữ liệu Google Sheets.";
        }
    }

    function renderList() {
        const grid = document.getElementById('post-grid');
        grid.innerHTML = db.map(p => `
            <div class="card">
                <span class="post-meta" style="font-size: 0.7rem;">${p.cat}</span>
                <h3>${p.title}</h3>
                <p>${p.desc}</p>
                <button class="btn btn-view" onclick="showPost('${p.id}')">Xem nội dung →</button>
            </div>
        `).join('');
    }

    function showPost(id) {
        const p = db.find(x => x.id === id);
        if(!p) return;

        document.getElementById('article-meta').innerText = p.cat;
        document.getElementById('article-title').innerText = p.title;
        
        let html = "";

        // 1. Phần Tiêu đề (Cột H)
        if(p.h_header) {
            html += `<div class="inner-header">${p.h_header.replace(/\n/g, '<br>')}</div>`;
        }

        // 2. Phần Thân bài (Cột I) - Xử lý thông minh tiêu đề con và đoạn văn
        if(p.i_body) {
            const lines = p.i_body.split(/\r?\n/);
            lines.forEach(line => {
                const text = line.trim();
                if(!text) return;
                
                if(/^\d+\./.test(text) || text.length < 50 && text.endsWith(":")) {
                    html += `<h2>${text}</h2>`;
                } else {
                    html += `<p>${text}</p>`;
                }
            });
        }

        // 3. Phần Kết luận (Cột J)
        if(p.j_footer) {
            html += `<div class="quote-box">${p.j_footer.replace(/\n/g, '<br>')}</div>`;
        }

        document.getElementById('article-content').innerHTML = html;
        toggleView(true);
        window.scrollTo(0,0);
        document.title = p.title + " - Tử Vi Hoàng Hạc";
    }

    function toggleView(isDetail) {
        const listView = document.getElementById('list-view');
        const detailView = document.getElementById('detail-view');
        if(isDetail) {
            listView.classList.add('hidden');
            detailView.classList.remove('hidden');
        } else {
            listView.classList.remove('hidden');
            detailView.classList.add('hidden');
            document.title = "Hệ Thống Di Sản - Tử Vi Hoàng Hạc";
        }
    }

    window.onload = init;
</script>
</body>
</html>
