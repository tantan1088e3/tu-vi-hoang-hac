<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nội dung - Tử Vi Hoàng Hạc</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Lora', serif; line-height: 1.8; max-width: 800px; margin: auto; padding: 20px; background: #fdf8f0; color: #2c3e50; }
        .article-container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: 1px solid #e0d5c1; position: relative; }
        .btn-back { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #8e2121; font-weight: bold; font-size: 0.9rem; transition: 0.3s; }
        .btn-back:hover { color: #c5a059; }
        
        /* Nút quay lại ở cuối trang */
        .btn-back-bottom { display: block; width: fit-content; margin: 40px auto 20px; padding: 10px 25px; border: 1px solid #8e2121; border-radius: 25px; text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem; }
        .btn-back-bottom:hover { background: #8e2121; color: white !important; }

        h1 { color: #5d1a1a; font-size: 2.2rem; margin-bottom: 10px; line-height: 1.3; }
        .meta-info { color: #c5a059; font-weight: bold; text-transform: uppercase; font-size: 0.85rem; margin-bottom: 20px; display: block; }
        .section-h { font-style: italic; color: #555; border-left: 4px solid #c5a059; padding-left: 15px; margin: 25px 0; }
        .section-i { font-size: 1.15rem; text-align: justify; margin-top: 20px; }
        .section-j { margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee; font-style: italic; color: #777; text-align: right; }
        
        /* Style cho các đầu mục 1, 2, 3... */
        .heading-number { font-weight: bold; color: #5d1a1a; font-size: 1.25rem; margin-top: 25px; display: block; }
        p { margin-bottom: 1.2rem; }
    </style>
</head>
<body>

    <a href="index.html" class="btn-back">← QUAY LẠI DANH SÁCH</a>
    
    <div id="article-view" class="article-container">
        Đang tải dữ liệu...
    </div>

    <!-- Nút quay lại cuối trang -->
    <a href="index.html" class="btn-back btn-back-bottom">Quay lại danh sách</a>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSLZA2IK9KlB335IHmfHYMDrW3TYRsV68Cu9E5rpKqar6n0dxYXUFl-WydtW4glFTg-f-OQGesLC_Me/pub?gid=0&single=true&output=csv&t=' + new Date().getTime();

        function parseLine(text) {
            const cells = [];
            let curr = '', inQ = false;
            for (let i = 0; i < text.length; i++) {
                if (text[i] === '"') inQ = !inQ;
                else if (text[i] === ',' && !inQ) { cells.push(curr.trim()); curr = ''; }
                else curr += text[i];
            }
            cells.push(curr.trim());
            return cells;
        }

        async function load() {
            const view = document.getElementById('article-view');
            const idReq = new URLSearchParams(window.location.search).get('id');

            try {
                const res = await fetch(SHEET_URL);
                const text = await res.text();
                const rows = text.split(/\r?\n(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                const headers = parseLine(rows[0]).map(h => h.toLowerCase().trim());
                
                const getVal = (rowCells, name) => {
                    const idx = headers.indexOf(name.toLowerCase());
                    return idx > -1 ? rowCells[idx] : "";
                };

                const targetRowRaw = rows.slice(1).find(r => parseLine(r)[headers.indexOf('id')] === idReq);

                if (targetRowRaw) {
                    const d = parseLine(targetRowRaw);
                    
                    // Logic format: Nếu dòng bắt đầu bằng số + dấu chấm thì in đậm
                    const format = (t) => {
                        if(!t) return "";
                        return t.split('\n').map(line => {
                            const trimmed = line.trim();
                            if (/^\d+\./.test(trimmed)) {
                                return `<span class="heading-number">${trimmed}</span>`;
                            }
                            return trimmed ? `<p>${trimmed}</p>` : "";
                        }).join('');
                    };

                    view.innerHTML = `
                        <span class="meta-info">${getVal(d, 'category')}</span>
                        <h1>${getVal(d, 'title')}</h1>
                        <div class="section-h">${format(getVal(d, 'h_header'))}</div>
                        <div class="section-i">${format(getVal(d, 'i_body'))}</div>
                        <div class="section-j">${format(getVal(d, 'j_footer'))}</div>
                    `;
                }
            } catch (e) {
                view.innerHTML = "Lỗi kết nối dữ liệu.";
            }
        }
        load();
    });
</script>
</body>
</html>
