<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Di Sản - Tử Vi Hoàng Hạc</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Lora', serif; line-height: 1.8; max-width: 850px; margin: auto; padding: 40px 20px; background: #fdf8f0; color: #333; }
        .article-container { background: white; padding: 50px; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .btn-back { display: inline-block; margin-bottom: 30px; text-decoration: none; color: #8e2121; font-weight: 600; font-size: 0.9rem; transition: 0.3s; }
        .btn-back:hover { transform: translateX(-5px); }
        
        .post-cat { color: #c5a059; font-weight: bold; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 2px; display: block; margin-bottom: 10px; }
        .post-title { font-family: 'Playfair Display', serif; color: #5d1a1a; font-size: 2.5rem; margin: 0 0 25px 0; line-height: 1.2; }
        
        .content-header { font-style: italic; color: #666; border-left: 3px solid #c5a059; padding-left: 20px; margin: 30px 0; font-size: 1.1rem; }
        .content-body { font-size: 1.15rem; text-align: justify; color: #2c3e50; }
        .content-footer { margin-top: 50px; padding-top: 30px; border-top: 1px double #ddd; color: #777; font-size: 1rem; font-style: italic; text-align: right; }
        
        p { margin-bottom: 1.5rem; }
    </style>
</head>
<body>

    <a href="index.html" class="btn-back">← QUAY LẠI DANH SÁCH</a>
    
    <div id="article-view" class="article-container">
        <p>Đang chuẩn bị tài liệu...</p>
    </div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSLZA2IK9KlB335IHmfHYMDrW3TYRsV68Cu9E5rpKqar6n0dxYXUFl-WydtW4glFTg-f-OQGesLC_Me/pub?gid=0&single=true&output=csv&t=' + new Date().getTime();

        function parseCSVLine(text) {
            const result = [];
            let cell = '', inQuotes = false;
            if(!text) return result;
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) {
                    result.push(cell.trim().replace(/^"|"$/g, ''));
                    cell = '';
                } else cell += char;
            }
            result.push(cell.trim().replace(/^"|"$/g, ''));
            return result;
        }

        async function loadContent() {
            const view = document.getElementById('article-view');
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            try {
                const res = await fetch(SHEET_URL);
                const csv = await res.text();
                
                // Tách hàng (Regex xử lý xuống dòng nằm trong dấu ngoặc kép)
                const rows = csv.split(/\r?\n(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                const headers = parseCSVLine(rows[0]);
                
                const idx = {
                    id: headers.indexOf('id'),
                    cat: headers.indexOf('category'),
                    title: headers.indexOf('title'),
                    header: headers.indexOf('h_header'),
                    body: headers.indexOf('i_body'),
                    footer: headers.indexOf('j_footer')
                };

                const targetRow = rows.slice(1).find(r => {
                    const cells = parseCSVLine(r);
                    return cells[idx.id] === id;
                });

                if (targetRow) {
                    const cells = parseCSVLine(targetRow);
                    
                    // Hàm xử lý xuống dòng cho từng đoạn
                    const formatText = (txt) => {
                        if(!txt) return "";
                        return txt.split('\n').map(l => l.trim() ? `<p>${l}</p>` : '').join('');
                    };

                    view.innerHTML = `
                        <span class="post-cat">${cells[idx.cat] || 'Tài liệu'}</span>
                        <h1 class="post-title">${cells[idx.title] || 'Không tiêu đề'}</h1>
                        
                        <div class="content-header">
                            ${formatText(cells[idx.header])}
                        </div>

                        <div class="content-body">
                            ${formatText(cells[idx.body])}
                        </div>

                        <div class="content-footer">
                            ${formatText(cells[idx.footer])}
                        </div>
                    `;
                    document.title = (cells[idx.title] || "Nội dung") + " - Tử Vi Hoàng Hạc";
                } else {
                    view.innerHTML = "<h2>Không tìm thấy bài viết.</h2>";
                }
            } catch (e) {
                view.innerHTML = "<h2>Lỗi tải dữ liệu. Vui lòng thử lại.</h2>";
            }
        }
        loadContent();
    });
</script>
</body>
</html>
