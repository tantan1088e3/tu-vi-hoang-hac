<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nội dung - Tử Vi Hoàng Hạc</title>
    <link rel="icon" type="image/png" href="data/fini-icon.png" sizes="96x96">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        /* Giao diện nền nhã nhặn, tôn vinh nội dung di sản */
        body { font-family: 'Lora', serif; line-height: 1.8; max-width: 850px; margin: auto; padding: 20px; background: #fdf8f0; color: #2c3e50; }
        
        .article-container { background: white; padding: 45px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #e0d5c1; position: relative; }
        
        /* Nút quay lại tinh tế */
        .btn-back { display: inline-flex; align-items: center; margin-bottom: 25px; text-decoration: none; color: #8e2121; font-weight: bold; font-size: 0.9rem; transition: 0.3s; }
        .btn-back:hover { color: #c5a059; transform: translateX(-5px); }
        
        .btn-back-bottom { display: block; width: fit-content; margin: 50px auto 20px; padding: 12px 30px; border: 1px solid #8e2121; border-radius: 30px; text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem; text-decoration: none; color: #8e2121; transition: 0.3s; }
        .btn-back-bottom:hover { background: #8e2121; color: white !important; }

        /* Typography */
        h1 { color: #5d1a1a; font-size: 2.4rem; margin-bottom: 15px; line-height: 1.2; letter-spacing: -0.5px; }
        .meta-info { color: #c5a059; font-weight: 700; text-transform: uppercase; font-size: 0.85rem; margin-bottom: 25px; display: block; letter-spacing: 1.5px; }
        
        /* Phần dẫn nhập (Sapo) */
        .section-h { font-style: italic; color: #4a4a4a; border-left: 5px solid #c5a059; padding: 10px 20px; margin: 30px 0; background: #fffcf8; font-size: 1.1rem; }
        
        /* Video Player mượt mà */
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; margin: 35px 0; border-radius: 15px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); background: #000; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        /* Nội dung chính */
        .section-i { font-size: 1.2rem; text-align: justify; color: #34495e; }
        .section-j { margin-top: 50px; padding-top: 25px; border-top: 1px dashed #dcdde1; font-style: italic; color: #7f8c8d; text-align: right; font-size: 1rem; }
        
        /* Định dạng đầu mục số */
        .heading-number { font-weight: 700; color: #5d1a1a; font-size: 1.4rem; margin-top: 35px; margin-bottom: 15px; display: block; border-bottom: 1px solid #f1f2f6; padding-bottom: 5px; }
        p { margin-bottom: 1.5rem; }

        /* Responsive cho di động */
        @media (max-width: 600px) {
            .article-container { padding: 25px; }
            h1 { font-size: 1.8rem; }
            .section-i { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn-back">← QUAY LẠI DANH SÁCH</a>
    
    <div id="article-view" class="article-container">
        <div style="text-align: center; padding: 60px;">
            <div style="font-size: 2rem; margin-bottom: 15px;">⏳</div>
            <div style="color: #c5a059; letter-spacing: 1px;">ĐANG KẾT NỐI KHO DI SẢN...</div>
        </div>
    </div>

    <a href="index.html" class="btn-back btn-back-bottom">Quay lại danh sách</a>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Cache bust URL để luôn lấy dữ liệu mới nhất
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSLZA2IK9KlB335IHmfHYMDrW3TYRsV68Cu9E5rpKqar6n0dxYXUFl-WydtW4glFTg-f-OQGesLC_Me/pub?gid=0&single=true&output=csv&t=' + new Date().getTime();

        function parseLine(text) {
            const cells = [];
            let curr = '', inQ = false;
            for (let i = 0; i < text.length; i++) {
                if (text[i] === '"') inQ = !inQ;
                else if (text[i] === ',' && !inQ) { cells.push(curr.trim()); curr = ''; }
                else curr += text[i];
            }
            cells.push(curr.trim());
            return cells;
        }

        async function load() {
            const view = document.getElementById('article-view');
            const idReq = new URLSearchParams(window.location.search).get('id');

            try {
                const res = await fetch(SHEET_URL);
                const text = await res.text();
                // Tách dòng thông minh bảo vệ nội dung trong ngoặc kép
                const rows = text.split(/\r?\n(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                const headers = parseLine(rows[0]).map(h => h.toLowerCase().trim());
                
                const getVal = (rowCells, name) => {
                    const idx = headers.indexOf(name.toLowerCase());
                    return idx > -1 ? rowCells[idx].replace(/^"|"$/g, '') : "";
                };

                const targetRowRaw = rows.slice(1).find(r => {
                    const cells = parseLine(r);
                    return cells[headers.indexOf('id')] === idReq;
                });

                if (targetRowRaw) {
                    const d = parseLine(targetRowRaw);
                    
                    const format = (t) => {
                        if(!t) return "";
                        return t.split('\n').map(line => {
                            const trimmed = line.trim();
                            // Nhận diện đầu mục 1. 2. 3. để in đậm phong cách cổ điển
                            if (/^\d+\./.test(trimmed)) {
                                return `<span class="heading-number">${trimmed}</span>`;
                            }
                            return trimmed ? `<p>${trimmed}</p>` : "";
                        }).join('');
                    };

                    // Xử lý Video YouTube (Cột youtubeid)
                    const youtubeId = getVal(d, 'youtubeid');
                    let videoHtml = "";
                    if (youtubeId && youtubeId.length > 5) {
                        videoHtml = `
                            <div class="video-wrapper">
                                <iframe src="https://www.youtube.com/embed/${youtubeId.trim()}?rel=0&modestbranding=1" 
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                    allowfullscreen loading="lazy">
                                </iframe>
                            </div>`;
                    }

                    // Render nội dung cuối cùng
                    view.innerHTML = `
                        <span class="meta-info">${getVal(d, 'category')}</span>
                        <h1>${getVal(d, 'title')}</h1>
                        <div class="section-h">${format(getVal(d, 'h_header'))}</div>
                        
                        ${videoHtml} 
                        
                        <div class="section-i">${format(getVal(d, 'i_body'))}</div>
                        <div style="margin-top: 40px; padding: 25px; border: 1px dashed #c5a059; background: #fffcf8; border-radius: 8px; text-align: center;">
                            <div style="font-size: 1.1rem; font-weight: bold; color: #5d1a1a; margin-bottom: 15px;">📖 KHÔNG GIAN SÁCH TỬ VI CỔ ĐIỂN</div>
                            <a href="https://shorten.asia/zTFbqRp3" target="_blank" rel="noopener noreferrer" style="display: inline-block; padding: 12px 35px; background: #8e2121; color: white; text-decoration: none; font-weight: bold; border-radius: 4px; box-shadow: 0 4px 15px rgba(142,33,33,0.2);">TÌM MUA SÁCH TRÊN SHOPEE</a>
                        </div>
                        <div class="section-j">${format(getVal(d, 'j_footer'))}</div>
                    `;
                } else {
                    view.innerHTML = "<div style='text-align: center; padding: 60px; color: #8e2121;'>⚠️ Nội dung không tồn tại hoặc đã được di dời.</div>";
                }
            } catch (e) {
                view.innerHTML = "<div style='text-align: center; padding: 60px;'>Lỗi kết nối kho dữ liệu. Vui lòng làm mới trang.</div>";
            }
        }
        load();
    });
</script>
</body>
</html>
