<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nội dung - Tử Vi Hoàng Hạc</title>
    <link rel="icon" type="image/png" href="data/fini-icon.png" sizes="96x96">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        /* Giao diện nền nhã nhặn, tôn vinh nội dung di sản */
        body { font-family: 'Lora', serif; line-height: 1.8; max-width: 850px; margin: auto; padding: 20px; background: #fdf8f0; color: #2c3e50; }
        
        .article-container { background: white; padding: 45px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #e0d5c1; position: relative; }
        
        /* Nút quay lại tinh tế */
        .btn-back { display: inline-flex; align-items: center; margin-bottom: 25px; text-decoration: none; color: #8e2121; font-weight: bold; font-size: 0.9rem; transition: 0.3s; }
        .btn-back:hover { color: #c5a059; transform: translateX(-5px); }
        
        .btn-back-bottom { display: block; width: fit-content; margin: 50px auto 20px; padding: 12px 30px; border: 1px solid #8e2121; border-radius: 30px; text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem; text-decoration: none; color: #8e2121; transition: 0.3s; }
        .btn-back-bottom:hover { background: #8e2121; color: white !important; }

        /* Typography */
        h1 { color: #5d1a1a; font-size: 2.4rem; margin-bottom: 15px; line-height: 1.2; letter-spacing: -0.5px; }
        .meta-info { color: #c5a059; font-weight: 700; text-transform: uppercase; font-size: 0.85rem; margin-bottom: 25px; display: block; letter-spacing: 1.5px; }
        
        /* Phần dẫn nhập (Sapo) - Tối ưu hiển thị xuống dòng tự nhiên */
        .section-h { font-style: italic; color: #4a4a4a; border-left: 5px solid #c5a059; padding: 10px 20px; margin: 30px 0; background: #fffcf8; font-size: 1.1rem; white-space: pre-line; }
        
        /* Video Player mượt mà */
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; margin: 35px 0; border-radius: 15px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); background: #000; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        /* Nội dung chính */
        .section-i { font-size: 1.2rem; text-align: justify; color: #34495e; }
        /* Footer bài viết - Căn lề phải chuẩn hóa khoảng cách */
        .section-j { margin-top: 40px; padding-top: 25px; border-top: 1px dashed #dcdde1; font-style: italic; color: #7f8c8d; text-align: right; font-size: 1rem; white-space: pre-line; }
        
        /* Định dạng đầu mục số */
        .heading-number { font-weight: 700; color: #5d1a1a; font-size: 1.4rem; margin-top: 35px; margin-bottom: 15px; display: block; border-bottom: 1px solid #f1f2f6; padding-bottom: 5px; }
        p { margin-bottom: 1.5rem; }

        /* CSS KHU VỰC THƯƠNG MẠI ĐIỆN TỬ - THIẾT KẾ ĐÃ ĐƯỢC PHÓNG TO */
        .aff-wrapper { margin: 50px auto 20px auto; display: flex; flex-direction: column; gap: 25px; width: 100%; }
        .aff-heading { font-size: 1.15rem; font-weight: bold; color: #5d1a1a; letter-spacing: 1px; border-bottom: 2px solid #e0d5c1; padding-bottom: 8px; margin-bottom: 5px; text-transform: uppercase; }
        .aff-container { padding: 30px; border: 1px solid #e0d5c1; background: #fffcf8; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.03); display: flex; gap: 35px; align-items: flex-start; position: relative; overflow: hidden; transition: 0.3s; }
        .aff-container:hover { box-shadow: 0 10px 30px rgba(142,33,33,0.08); border-color: #c5a059; }
        
        /* Khung ảnh gallery phóng to bề thế */
        .aff-gallery-side { width: 220px; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; }
        .aff-main-img-box { width: 220px; height: 300px; border-radius: 8px; box-shadow: 3px 6px 15px rgba(0,0,0,0.15); overflow: hidden; background: #fff; border: 1px solid #eee; }
        .aff-book-main-img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
        .aff-thumb-list { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .aff-thumb-item { width: 45px; height: 45px; border: 1px solid #e0d5c1; border-radius: 4px; overflow: hidden; cursor: pointer; opacity: 0.5; background: #fff; transition: 0.2s; }
        .aff-thumb-item:hover, .aff-thumb-item.active { border-color: #8e2121; opacity: 1; transform: scale(1.08); }
        .aff-thumb-item img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Khung thông tin chi tiết bên phải */
        .aff-info { flex-grow: 1; display: flex; flex-direction: column; gap: 15px; padding-top: 5px; }
        .aff-book-title { font-size: 1.4rem; font-weight: 700; color: #5d1a1a; margin: 0; line-height: 1.4; }
        .aff-desc { font-size: 1rem; color: #444; margin: 0; font-style: italic; line-height: 1.6; }
        .btn-aff-vip { width: fit-content; margin-top: 10px; padding: 12px 30px; background: #8e2121; color: white !important; text-decoration: none; font-weight: bold; font-size: 0.95rem; border-radius: 4px; transition: 0.3s; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 4px 12px rgba(142,33,33,0.25); }
        .btn-aff-vip:hover { background: #c5a059; box-shadow: 0 4px 15px rgba(197,160,89,0.35); }

        /* Responsive cho thiết bị di động */
        @media (max-width: 600px) {
            .article-container { padding: 25px; }
            h1 { font-size: 1.8rem; }
            .section-i { font-size: 1.1rem; }
            .aff-container { flex-direction: column; text-align: center; padding: 20px; gap: 20px; align-items: center; }
            .aff-gallery-side { width: 100%; align-items: center; }
            .aff-main-img-box { width: 180px; height: 250px; }
            .btn-aff-vip { width: 100%; box-sizing: border-box; text-align: center; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn-back">← QUAY LẠI DANH SÁCH</a>
    
    <div id="article-view" class="article-container">
        <div style="text-align: center; padding: 60px;">
            <div style="font-size: 2rem; margin-bottom: 15px;">⏳</div>
            <div style="color: #c5a059; letter-spacing: 1px;">ĐANG KẾT NỐI KHO DI SẢN...</div>
        </div>
    </div>

    <a href="index.html" class="btn-back btn-back-bottom">Quay lại danh sách</a>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSLZA2IK9KlB335IHmfHYMDrW3TYRsV68Cu9E5rpKqar6n0dxYXUFl-WydtW4glFTg-f-OQGesLC_Me/pub?gid=0&single=true&output=csv&t=' + new Date().getTime();

        function parseLine(text) {
            const cells = [];
            let curr = '', inQ = false;
            for (let i = 0; i < text.length; i++) {
                if (text[i] === '"') inQ = !inQ;
                else if (text[i] === ',' && !inQ) { cells.push(curr.trim()); curr = ''; }
                else curr += text[i];
            }
            cells.push(curr.trim());
            return cells;
        }

        async function load() {
            const view = document.getElementById('article-view');
            const idReq = new URLSearchParams(window.location.search).get('id');

            try {
                const res = await fetch(SHEET_URL);
                const text = await res.text();
                const rows = text.split(/\r?\n(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                const headers = parseLine(rows[0]).map(h => h.toLowerCase().trim());
                
                const getVal = (rowCells, name) => {
                    const idx = headers.indexOf(name.toLowerCase());
                    return idx > -1 ? rowCells[idx].replace(/^"|"$/g, '').trim() : "";
                };

                const targetRowRaw = rows.slice(1).find(r => {
                    const cells = parseLine(r);
                    return cells[headers.indexOf('id')] === idReq;
                });

                if (targetRowRaw) {
                    const d = parseLine(targetRowRaw);
                    
                    const formatBody = (t) => {
                        if(!t) return "";
                        return t.split('\n').map(line => {
                            const trimmed = line.trim();
                            if (/^\d+\./.test(trimmed)) {
                                return `<span class="heading-number">${trimmed}</span>`;
                            }
                            return trimmed ? `<p>${trimmed}</p>` : "";
                        }).join('');
                    };

                    const youtubeId = getVal(d, 'youtubeid');
                    let videoHtml = "";
                    if (youtubeId && youtubeId.length > 5) {
                        videoHtml = `
                            <div class="video-wrapper">
                                <iframe src="https://www.youtube.com/embed/${youtubeId.trim()}?rel=0&modestbranding=1" 
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                    allowfullscreen loading="lazy">
                                </iframe>
                            </div>`;
                    }

                    // XỬ LÝ ĐỘNG KHU VỰC THƯƠNG MẠI
                    const rawLinks = getVal(d, 'aff_link');
                    const rawImgs = getVal(d, 'aff_img');
                    const rawNames = getVal(d, 'aff_name');
                    
                    let affHtml = "";

                    if (rawLinks && rawNames) {
                        const bookNames = rawNames.split(/[|\n\r\u2028\u2029]+/).map(x => x.trim()).filter(x => x.length > 0);
                        const bookLinks = rawLinks.split(/[|\n\r\u2028\u2029]+/).map(x => x.trim()).filter(x => x.length > 0);
                        const bookImgRows = rawImgs.split(/[|\n\r\u2028\u2029]+/).map(x => x.trim());

                        if (bookNames.length > 0) {
                            let itemsHtml = "";
                            
                            bookNames.forEach((name, index) => {
                                const link = bookLinks[index] || bookLinks[0];
                                const imgRow = bookImgRows[index] || "";
                                
                                const imgs = imgRow.split(',')
                                    .map(x => x.trim().replace(/[\r\n]/g, ""))
                                    .filter(x => x.length > 0);

                                if (imgs.length === 0 || imgs[0] === "") {
                                    imgs[0] = "data/fini-icon.png";
                                }
                                
                                const mainImgId = `img_main_${index}_` + Math.random().toString(36).substr(2, 5);
                                
                                let thumbsHtml = "";
                                if (imgs.length > 1) {
                                    thumbsHtml = `<div class="aff-thumb-list">`;
                                    imgs.forEach((imgUrl, idx) => {
                                        thumbsHtml += `
                                            <div class="aff-thumb-item ${idx === 0 ? 'active' : ''}" 
                                                 onclick="document.getElementById('${mainImgId}').src='${imgUrl}'; 
                                                          this.parentElement.querySelector('.active').classList.remove('active'); 
                                                          this.classList.add('active');">
                                                <img src="${imgUrl}" alt="Mẫu xem thử">
                                            </div>`;
                                    });
                                    thumbsHtml += `</div>`;
                                }
                                
                                itemsHtml += `
                                    <div class="aff-container">
                                        <div class="aff-gallery-side">
                                            <div class="aff-main-img-box">
                                                <img id="${mainImgId}" src="${imgs[0]}" class="aff-book-main-img" alt="${name}">
                                            </div>
                                            ${thumbsHtml}
                                        </div>
                                        <div class="aff-info">
                                            <h3 class="aff-book-title">${name}</h3>
                                            <p class="aff-desc">Tài liệu tra cứu nghiên cứu chuyên sâu, hỗ trợ đắc lực trong việc lập số và luận đoán học thuật.</p>
                                            <a href="${link}" target="_blank" rel="noopener noreferrer" class="btn-aff-vip">MUA SÁCH TRÊN SHOPEE ➔</a>
                                        </div>
                                    </div>`;
                            });

                            affHtml = `
                                <div class="aff-wrapper">
                                    <div class="aff-heading">📖 TÀI LIỆU THAM KHẢO NÊN CÓ</div>
                                    ${itemsHtml}
                                </div>`;
                        }
                    }

                    // Render toàn bộ nội dung hoàn chỉnh lên màn hình
                    view.innerHTML = `
                        <span class="meta-info">${getVal(d, 'category')}</span>
                        <h1>${getVal(d, 'title')}</h1>
                        <div class="section-h">${getVal(d, 'h_header')}</div>
                        
                        ${videoHtml} 
                        
                        <div class="section-i">${formatBody(getVal(d, 'i_body'))}</div>
                        
                        ${affHtml}
                        
                        <div class="section-j">${getVal(d, 'j_footer')}</div>
                    `;
                } else {
                    view.innerHTML = "<div style='text-align: center; padding: 60px; color: #8e2121;'>⚠️ Nội dung không tồn tại hoặc đã được di dời.</div>";
                }
            } catch (e) {
                view.innerHTML = "<div style='text-align: center; padding: 60px;'>Lỗi kết nối kho dữ liệu. Vui lòng làm mới trang.</div>";
            }
        }
        load();
    });
</script>
</body>
</html>
