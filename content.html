<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nội Dung Di Sản - Tử Vi Hoàng Hạc</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Arimo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-color: #5d1a1a; --accent-color: #c5a059; --bg-color: #fffaf1; --text-color: #2c3e50; }
        body { margin: 0; font-family: 'Arimo', sans-serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.8; }
        .container { max-width: 850px; margin: 3rem auto; padding: 0 1.5rem; }
        .article-container { background: white; padding: 3rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); min-height: 400px; }
        .post-meta { color: var(--accent-color); font-weight: bold; text-transform: uppercase; font-size: 0.85rem; margin-bottom: 10px; display: block; }
        h1 { font-family: 'Playfair Display', serif; color: var(--primary-color); font-size: 2.2rem; line-height: 1.2; margin: 0 0 2rem 0; }
        .content { font-size: 1.1rem; text-align: justify; white-space: pre-line; } /* white-space để giữ xuống dòng */
        .btn-back { display: inline-block; margin-bottom: 2rem; text-decoration: none; color: var(--primary-color); font-weight: bold; font-size: 0.9rem; }
        .loading { text-align: center; color: #888; margin-top: 50px; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-back">← Quay lại danh sách</a>
    <article class="article-container" id="article-view">
        <div class="loading">Đang tải nội dung từ Google Sheets...</div>
    </article>
</div>

<script>
    // Link CSV của ông - thêm Date để xóa cache
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSLZA2IK9KlB335IHmfHYMDrW3TYRsV68Cu9E5rpKqar6n0dxYXUFl-WydtW4glFTg-f-OQGesLC_Me/pub?gid=0&single=true&output=csv&t=' + new Date().getTime();

    // Hàm tách CSV chuẩn (xử lý được cả dấu phẩy bên trong nội dung)
    function parseCSVLine(text) {
        const result = []; let cell = '', inQuotes = false;
        for (let i = 0; i < text.length; i++) {
            let char = text[i];
            if (char === '"') { inQuotes = !inQuotes; }
            else if (char === ',' && !inQuotes) { result.push(cell.trim()); cell = ''; }
            else { cell += char; }
        }
        result.push(cell.trim()); return result;
    }

    async function loadPost() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        try {
            const res = await fetch(SHEET_URL);
            const csv = await res.text();
            const rows = csv.split(/\r?\n/);
            const headers = parseCSVLine(rows[0]).map(h => h.toLowerCase());
            
            // Tìm vị trí các cột
            const idIdx = headers.indexOf('id');
            const titleIdx = headers.indexOf('title');
            const catIdx = headers.indexOf('category');
            const contentIdx = headers.indexOf('fullcontent'); // Đảm bảo cột nội dung tên là fullcontent

            // Tìm hàng có ID trùng khớp
            const postRow = rows.slice(1).find(r => {
                const cells = parseCSVLine(r);
                return cells[idIdx] === id;
            });

            if (postRow) {
                const cells = parseCSVLine(postRow);
                document.getElementById('article-view').innerHTML = `
                    <span class="post-meta">${cells[catIdx] || 'Tài liệu'}</span>
                    <h1>${cells[titleIdx]}</h1>
                    <div class="content">${cells[contentIdx] || 'Chưa có nội dung chi tiết cho bài này.'}</div>
                `;
            } else {
                document.getElementById('article-view').innerHTML = "<h2>Không tìm thấy nội dung bài viết.</h2>";
            }
        } catch (e) {
            document.getElementById('article-view').innerHTML = "<h2>Lỗi kết nối dữ liệu.</h2>";
        }
    }
    window.onload = loadPost;
</script>
</body>
</html>
