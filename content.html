<script>
    // Link CSV của ông
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSLZA2IK9KlB335IHmfHYMDrW3TYRsV68Cu9E5rpKqar6n0dxYXUFl-WydtW4glFTg-f-OQGesLC_Me/pub?gid=0&single=true&output=csv&t=' + new Date().getTime();

    async function loadSimpleTest() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        try {
            const res = await fetch(SHEET_URL);
            const csv = await res.text();
            const rows = csv.split(/\r?\n/).filter(r => r.trim() !== "");
            
            // Hàm tách cột đơn giản bằng dấu phẩy (vì test cột H nên ít bị dính dấu phẩy nội dung)
            const headers = rows[0].split(',').map(h => h.toLowerCase().trim());
            const hIdx = headers.indexOf('h_header'); 
            const idIdx = headers.indexOf('id');

            const postRow = rows.slice(1).find(r => {
                const cells = r.split(',');
                return cells[idIdx] === id;
            });

            if (postRow) {
                const cells = postRow.split(',');
                const contentH = cells[hIdx] ? cells[hIdx].replace(/"/g, '') : "Cột H đang trống";
                
                document.getElementById('article-view').innerHTML = `
                    <h2 style="color: red;">Đã nhận dữ liệu test từ cột H:</h2>
                    <div style="font-size: 1.5rem; background: #eee; padding: 20px;">
                        ${contentH}
                    </div>
                `;
            } else {
                document.getElementById('article-view').innerHTML = "Không tìm thấy ID: " + id;
            }
        } catch (e) {
            document.getElementById('article-view').innerHTML = "Lỗi kết nối: " + e;
        }
    }
    window.onload = loadSimpleTest;
</script>
