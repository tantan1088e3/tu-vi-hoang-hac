<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tử Vi Hoàng Hạc - Hệ Thống Di Sản</title>
    <link rel="icon" type="image/png" href="data/hoang-hac-icon-fini.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Arimo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-color: #5d1a1a; --accent-color: #c5a059; --bg-color: #fffaf1; --text-color: #2c3e50; }
        body { margin: 0; font-family: 'Arimo', sans-serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; }
        
        header { background-color: var(--primary-color); color: var(--accent-color); padding: 3rem 1rem; text-align: center; border-bottom: 5px solid var(--accent-color); }
        header h1 { font-family: 'Playfair Display', serif; margin: 0; text-transform: uppercase; letter-spacing: 3px; font-size: 2.8rem; }
        header p { margin-top: 10px; opacity: 0.9; font-style: italic; }

        .control-panel { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
        
        .tabs { display: flex; gap: 5px; background: #e0d5c1; padding: 5px; border-radius: 8px; }
        .tab-btn { padding: 10px 20px; border: none; background: transparent; cursor: pointer; font-weight: bold; border-radius: 6px; transition: 0.3s; text-decoration: none; color: #5d1a1a; }
        .tab-btn.active { background: var(--primary-color); color: white; }
        
        #search-bar { padding: 12px; width: 300px; border: 1px solid #ccc; border-radius: 6px; outline: none; font-family: inherit; }

        .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 2rem; padding: 15px; background: white; border-radius: 8px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05); }
        .tag-filter { padding: 6px 18px; background: white; border: 1px solid #ddd; border-radius: 20px; font-size: 0.85rem; cursor: pointer; transition: 0.3s; }
        .tag-filter.active { background: var(--accent-color); color: white; border-color: var(--accent-color); }

        .container { max-width: 1100px; margin: 0 auto 5rem auto; padding: 0 1.5rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 2rem; }
        
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 5px solid var(--primary-color); display: flex; flex-direction: column; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .card.featured { border-left: 8px solid var(--accent-color); }
        
        .category-tag { font-size: 0.75rem; font-weight: bold; color: #999; text-transform: uppercase; margin-bottom: 10px; display: block; }
        .card h3 { margin: 0 0 15px 0; color: var(--primary-color); font-size: 1.4rem; line-height: 1.3; }
        .card p { color: #666; font-size: 0.95rem; margin-bottom: 20px; flex-grow: 1; }

        .btn-post { padding: 10px; text-decoration: none; font-weight: bold; text-align: center; border-radius: 5px; border: 1px solid var(--primary-color); color: var(--primary-color); transition: 0.3s; }
        .btn-post:hover { background: var(--primary-color); color: white; }

        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 40px; }
        .page-btn { width: 40px; height: 40px; border: none; background: #e0d5c1; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .page-btn.active { background: var(--primary-color); color: white; }

        footer { text-align: center; padding: 3rem; background: #1a1a1a; color: #888; border-top: 4px solid var(--accent-color); }
    </style>
</head>
<body>

<header>
    <h1>TỬ VI HOÀNG HẠC</h1>
    <p>Hệ Thống Di Sản & Nghiệm Lý 2026</p>
</header>

<div class="control-panel">
    <div class="top-bar">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('posts')">BÀI VIẾT</button>
            <button class="tab-btn" onclick="switchTab('video')">THƯ VIỆN VIDEO</button> <!-- Thêm dòng này -->
            <button class="tab-btn" onclick="switchTab('pdf')">THƯ VIỆN PDF</button>
        </div>
        <input type="text" id="search-bar" placeholder="Tìm kiếm nội dung..." onkeyup="handleSearch()">
    </div>
    <div id="filter-bar" class="filter-bar"></div>
</div>

<div class="container">
    <div class="grid" id="post-grid">Đang kết nối kho di sản...</div>
    <div id="post-pagination" class="pagination"></div>
</div>

<footer style="text-align: center; padding: 3rem 1.5rem; background: #1a1a1a; color: #888; border-top: 4px solid var(--accent-color);">
    <div style="max-width: 400px; margin: 0 auto 30px auto; padding: 20px; border: 1px solid #333; border-radius: 15px; background: #222;">
        <p style="color: var(--accent-color); font-weight: bold; margin-top: 0; letter-spacing: 1px;">ỦNG HỘ DI SẢN CỤ HOÀNG HẠC</p>
        
        <!-- Link ảnh QR lấy từ GitHub của ông -->
        <img src="https://raw.githubusercontent.com/tantan1088e3/tu-vi-hoang-hac/main/data/qr.png" 
             alt="QR Donate VPBank" 
             style="width: 180px; height: auto; border-radius: 10px; border: 4px solid white; margin: 15px 0;">
        
        <p style="font-size: 0.9rem; line-height: 1.5; color: #bbb; margin-bottom: 0;">
            <span style="font-style: italic; font-size: 0.85rem;">Nếu hữu duyên, mời tôi một ly cafe để duy trì hệ thống và kho dữ liệu nghiệm lý.</span>
        </p>
    </div>

    <p style="margin-bottom: 20px;">&copy; 2026 Tử Vi Hoàng Hạc - Lưu giữ di sản cụ Trương Cung Tùng</p>

    <!-- Bộ đếm lượt truy cập giữ nguyên bên dưới -->
    <div style="font-size: 0.9rem; border-top: 1px solid #333; pt-20px; display: inline-block; padding-top: 20px;">
        Số lượt truy cập: 
        <img src="https://counter1.fc2.com/counter_img.php?id=89493181" style="vertical-align: middle;">
    </div>
</footer>


<script>
    let pdfDb = []; // Lưu trữ danh sách file PDF tạm thời
    let currentPdfPage = 1;
    const pdfLimit = 6; // Số file mỗi trang
    
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSLZA2IK9KlB335IHmfHYMDrW3TYRsV68Cu9E5rpKqar6n0dxYXUFl-WydtW4glFTg-f-OQGesLC_Me/pub?gid=0&single=true&output=csv&t=' + new Date().getTime();
    let db = [];
    let currentCategory = 'Tất cả';
    let searchQuery = '';
    let currentPage = 1;
    const limit = 6;

    function parseCSVLine(text) {
        const r = []; let c = '', q = false;
        for (let i = 0; i < text.length; i++) {
            let char = text[i];
            if (char === '"') { if (q && text[i+1] === '"') { c += '"'; i++; } else q = !q; }
            else if (char === ',' && !q) { r.push(c.trim()); c = ''; }
            else c += char;
        }
        r.push(c.trim()); return r;
    }

    async function init() {
    try {
        const res = await fetch(SHEET_URL);
        const csv = await res.text();
        // Tách các dòng từ CSV, xử lý cả trường hợp nội dung có dấu phẩy bên trong ngoặc kép
        const rows = csv.split(/\r?\n(?=(?:(?:[^"]*"){2})*[^"]*$)/);
        const headers = parseCSVLine(rows[0]).map(h => h.toLowerCase().trim());
        
        // Khai báo chỉ mục (index) cho tất cả các cột cần thiết, bao gồm cả youtubeid
        const idx = { 
            id: headers.indexOf('id'), 
            cat: headers.indexOf('category'), 
            title: headers.indexOf('title'), 
            desc: headers.indexOf('desc'), 
            feat: headers.indexOf('featured'),
            youtubeId: headers.indexOf('youtubeid') // Thêm cột youtubeid từ file CSV
        };

        // Chuyển đổi dữ liệu từ các dòng CSV thành mảng đối tượng (db)
        db = rows.slice(1).map(r => {
            const c = parseCSVLine(r);
            return { 
                id: c[idx.id], 
                category: c[idx.cat] || "Chưa phân loại", 
                title: c[idx.title], 
                desc: c[idx.desc], 
                isFeatured: String(c[idx.feat]).toLowerCase() === 'true',
                youtubeId: c[idx.youtubeId] || "" // Lưu trữ mã video để dùng cho Tab Video
            };
        }).filter(p => p.id); // Loại bỏ các dòng trống không có ID

        renderTags();
        renderUI();
    } catch (e) { 
        console.error(e);
        document.getElementById('post-grid').innerHTML = "Lỗi kết nối dữ liệu."; 
    }
}

    function renderTags() {
        const tags = new Set(['Tất cả', ...db.map(p => p.category)]);
        document.getElementById('filter-bar').innerHTML = Array.from(tags).map(t => 
            `<span class="tag-filter ${t === currentCategory ? 'active' : ''}" onclick="filterByTag('${t}')">${t}</span>`
        ).join('');
    }

    function filterByTag(tag) {
        currentCategory = tag;
        currentPage = 1;
        renderTags();
        renderUI();
    }

    function handleSearch() {
        searchQuery = document.getElementById('search-bar').value.toLowerCase();
        currentPage = 1;
        renderUI();
    }

    function switchTab(type) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.currentTarget.classList.add('active');
    
        const grid = document.getElementById('post-grid');
        const pagination = document.getElementById('post-pagination');
        const filterBar = document.getElementById('filter-bar');
    
        grid.innerHTML = ""; 
    
        if (type === 'pdf') {
            currentPdfPage = 1;
            filterBar.style.display = "none";
            grid.innerHTML = "<div style='grid-column: 1/-1; text-align: center; padding: 50px;'>⏳ Đang quét thư mục tài liệu...</div>";
            pagination.innerHTML = "";
            loadPDFLibrary(); 
        } else if (type === 'video') { // Logic cho Tab Video
            filterBar.style.display = "none";
            pagination.innerHTML = "";
            grid.innerHTML = "<div style='grid-column: 1/-1; text-align: center; padding: 50px;'>🎬 Đang tải danh sách bài giảng...</div>";
            loadVideoLibrary(); // Bạn sẽ cần viết thêm hàm này để lấy dữ liệu video từ YouTube hoặc Sheet
        } else {
            filterBar.style.display = "flex";
            renderUI();
        }
    }

    function renderUI() {
        let filtered = db.filter(p => {
            const matchCat = (currentCategory === 'Tất cả' || p.category === currentCategory);
            const matchSearch = (p.title.toLowerCase().includes(searchQuery) || p.desc.toLowerCase().includes(searchQuery));
            return matchCat && matchSearch;
        });

        filtered.sort((a,b) => b.isFeatured - a.isFeatured);
        
        const start = (currentPage - 1) * limit;
        const items = filtered.slice(start, start + limit);
        
        const grid = document.getElementById('post-grid');
        if (items.length === 0) {
            grid.innerHTML = "<p style='grid-column: 1/-1; text-align: center;'>Không tìm thấy nội dung phù hợp.</p>";
            return;
        }

        grid.innerHTML = items.map(p => `
            <div class="card ${p.isFeatured ? 'featured' : ''}">
                <span class="category-tag">${p.category}</span>
                <h3>${p.title}</h3>
                <p>${p.desc}</p>
                <a href="content.html?id=${p.id}" class="btn-post">Đọc tiếp →</a>
            </div>
        `).join('');

        renderPagination(filtered.length);
    }

    function renderPagination(total) {
        const pages = Math.ceil(total / limit);
        let html = '';
        for(let i=1; i<=pages; i++) {
            html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
        }
        document.getElementById('post-pagination').innerHTML = html;
    }

    function goToPage(p) { currentPage = p; renderUI(); window.scrollTo(0,0); }

    async function loadPDFLibrary() {
        const username = "tantan1088e3"; 
        const repo = "tu-vi-hoang-hac";   
        const folder = "download";       
        const GITHUB_API_URL = `https://api.github.com/repos/${username}/${repo}/contents/${folder}`;
    
        try {
            const res = await fetch(GITHUB_API_URL);
            const files = await res.json();
            
            // Lọc file PDF và lưu vào mảng dùng chung
            pdfDb = files.filter(file => file.name.toLowerCase().endsWith('.pdf'));
    
            renderPDFUI(); // Gọi hàm hiển thị riêng
        } catch (e) {
            document.getElementById('post-grid').innerHTML = "Lỗi kết nối thư viện.";
        }
    }

    function renderPDFUI() {
        const start = (currentPdfPage - 1) * pdfLimit;
        const items = pdfDb.slice(start, start + pdfLimit);
        const grid = document.getElementById('post-grid');
    
        if (items.length === 0) {
            grid.innerHTML = "<p style='grid-column: 1/-1; text-align: center;'>Chưa có tài liệu nào.</p>";
            return;
        }
    
        grid.innerHTML = items.map(file => `
            <div class="card">
                <span class="category-tag">TÀI LIỆU PDF</span>
                <h3>${file.name.replace('.pdf', '').replace(/-/g, ' ')}</h3>
                <p>Tài liệu được lưu trữ tự động trong hệ thống di sản.</p>
                <a href="${file.download_url}" target="_blank" class="btn-post" style="background: #2c3e50; color: white; border: none;">Tải xuống PDF ↓</a>
            </div>
        `).join('');
    
        renderPDFPagination(pdfDb.length);
    }

function renderPDFPagination(total) {
    const pages = Math.ceil(total / pdfLimit);
    let html = '';
    if (pages < 1) { 
        document.getElementById('post-pagination').innerHTML = "";
        return; 
    }
    
    for(let i = 1; i <= pages; i++) {
        html += `<button class="page-btn ${i === currentPdfPage ? 'active' : ''}" onclick="goPdfPage(${i})">${i}</button>`;
    }
    document.getElementById('post-pagination').innerHTML = html;
}

async function loadVideoLibrary() {
    const grid = document.getElementById('post-grid');
    
    // Lọc danh sách các bài viết có chứa youtubeId
    const videoPosts = db.filter(p => p.youtubeId && p.youtubeId.trim() !== "");

    if (videoPosts.length === 0) {
        grid.innerHTML = "<p style='grid-column: 1/-1; text-align: center;'>Hiện chưa có bài giảng video nào được cập nhật.</p>";
        return;
    }

    grid.innerHTML = videoPosts.map(p => `
        <div class="card">
            <div style="position: relative; margin-bottom: 15px; border-radius: 8px; overflow: hidden; background: #000;">
                <img src="https://img.youtube.com/vi/${p.youtubeId.trim()}/mqdefault.jpg" style="width: 100%; display: block; opacity: 0.8;">
                <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 2rem; pointer-events: none;">▶</div>
            </div>
            <span class="category-tag">VIDEO BÀI GIẢNG</span>
            <h3>${p.title}</h3>
            <p>${p.desc}</p>
            <a href="content.html?id=${p.id}" class="btn-post">Xem Video & Nghiệm lý →</a>
        </div>
    `).join('');
}
    
function goPdfPage(p) {
    currentPdfPage = p;
    renderPDFUI();
    window.scrollTo(0, 0);
}

window.onload = init;
</script>
<script>
function cb(response) {
    document.getElementById('visits').innerText = response.value;
}
</script>
<script async src="https://api.countapi.xyz/hit/tuvihoanghac.id.vn/visits?callback=cb"></script>
</body>
</html>
